name: Run Lane Detection

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect-lanes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lane detection on sample image
        run: python lane_detection.py --mode image --input sample_road.jpg

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: detected-lane-output
          path: lane_detected.jpg
          
